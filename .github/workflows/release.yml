name: Launcher release

# Publishes the ARM64 launcher as release vVERSION (the VERSION file): the
# launcher and the patched source, with the build tools and the ARM64 sysroot
# pinned in toolchain.json. No game files: the launcher builds the game from
# the player's own disc on the handheld.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 60
    steps:
      - name: Install git and Python
        run: |
          dnf install -y --setopt=install_weak_deps=False git-core python3 tar xz gzip \
            findutils zlib-ng-compat sdl2-compat
      - uses: actions/checkout@v5
      # The launcher's data folder, where it keeps the build tools.
      - name: Keep the launcher's data in the workspace
        run: echo "XDG_DATA_HOME=$GITHUB_WORKSPACE/.data" >> "$GITHUB_ENV"
      - name: Check that a sysroot is pinned
        run: |
          if ! python3 -c 'import json, sys; sys.exit("sysroot" not in json.load(open("toolchain.json")))'; then
            echo "::error::No ARM64 sysroot is pinned yet; run the ARM64 sysroot workflow and scripts/pin-sysroot.py first."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: .data/MidtownMadness3/toolchain
          key: device-tools-${{ hashFiles('toolchain.json') }}
      - name: Check out upstream and apply the patches
        run: scripts/prepare-source.sh "$RUNNER_TEMP/mm3-recomp"
      - name: Package the launcher
        run: scripts/package-launcher.sh "$RUNNER_TEMP/mm3-recomp" out/launcher
      - uses: actions/upload-artifact@v7
        with:
          name: MidtownMadness3-Launcher-linux-arm64
          path: out/launcher/MidtownMadness3-Launcher-linux-arm64.tar.gz
          retention-days: 7

  publish:
    needs: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: MidtownMadness3-Launcher-linux-arm64
          path: out/launcher
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=out/launcher/MidtownMadness3-Launcher-linux-arm64.tar.gz
          version="$(cat VERSION)"
          commit="$(jq -r .commit upstream.json)"
          sysroot="$(jq -r .sysroot.version toolchain.json)"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          scripts/release-notes.sh "v$version" > notes.md
          cat >> notes.md <<NOTES
          ## Install

          Midtown Madness 3 for ARM64 Linux handhelds, such as the Retroid Pocket 6 on ArmadaOS, built from [mm3-recomp ${commit:0:7}](https://github.com/MattSG/mm3-recomp/commit/$commit).

          On the handheld, in Desktop Mode: unpack $(basename "$archive"), start MidtownMadness3/mm3-launcher and choose your own disc image of Midtown Madness 3 (USA or Europe). The launcher checks it, downloads its build tools and the ARM64 sysroot $sysroot, builds the game on the handheld (about 6 GB free on top of the image's size; keep it on the charger) and offers Play and Add to Steam. See the README for details.

          No game files are included. SHA-256: \`$sha256\`
          NOTES
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release upload "v$version" "$archive" --clobber
            gh release edit "v$version" --notes-file notes.md
          else
            gh release create "v$version" "$archive" --title "Midtown Madness 3 $version for ARM64 Linux" \
              --notes-file notes.md
          fi
